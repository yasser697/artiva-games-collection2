name: Build ARTIVA Games APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack ZIP if needed & Build Debug APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 4 -name 'settings.gradle' | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Unzipping $ZIP_FILE ..."
              unzip -q "$ZIP_FILE" -d _unpacked
              SETTINGS_FILE=$(find _unpacked -maxdepth 4 -name 'settings.gradle' | head -n 1)
            fi
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "لم يتم العثور على settings.gradle ولا على ملف ZIP داخل المستودع!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building from: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTIVA-Games-Collection-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
